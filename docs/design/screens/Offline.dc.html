<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { checking: false, tries: 1, n: 0, taps: 0 };

  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
    this.timer = null;
  }

  retry() {
    const s = this.state;
    if (s.checking) return;
    this.setState({ checking: true });
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      this.timer = null;
      const cur = this.state;
      this.setState({ checking: false, tries: cur.tries + 1, n: cur.n + 1 });
    }, 1600);
  }

  nudge() {
    const s = this.state;
    this.setState({ n: s.n + 1, taps: s.taps + 1 });
  }

  renderVals() {
    const s = this.state || { checking: false, tries: 1, n: 0, taps: 0 };
    const alt = k => (k % 2 ? '-b' : '');
    return {
      bannerAnim: s.n > 0 ? 'sf-shake' + alt(s.n) + ' .32s ease-in-out' : 'none',
      ctaAnim: s.n > 0 ? 'sf-bump' + alt(s.n) + ' .5s cubic-bezier(.34,1.56,.64,1)' : 'none',
      badgeAnim: s.taps > 0 ? 'sf-bump' + alt(s.taps) + ' .4s cubic-bezier(.34,1.56,.64,1)' : 'none',
      checking: s.checking,
      idle: !s.checking,
      retryLabel: s.checking ? 'בודק חיבור…' : 'בדוק שוב',
      busy: s.checking ? 'true' : 'false',
      hasStatus: !s.checking && s.tries > 1,
      tries: String(s.tries),
      statusAnim: 'sf-tick' + alt(s.tries) + ' .32s cubic-bezier(.2,.8,.2,1) both',
      retry: () => this.retry(),
      nudge: () => this.nudge()
    };
  }
}
</script>
