<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { trying: false, tries: 1, n: 0 };

  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
    this.timer = null;
  }

  retry() {
    if (this.state.trying) return;
    this.setState({ trying: true });
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      this.timer = null;
      const s = this.state;
      this.setState({ trying: false, tries: s.tries + 1, n: s.n + 1 });
    }, 1800);
  }

  renderVals() {
    const s = this.state || { trying: false, tries: 1, n: 0 };
    const alt = k => (k % 2 ? '-b' : '');
    return {
      trying: s.trying,
      idle: !s.trying,
      plugX: s.trying ? '20px' : '0px',
      sparkOp: s.trying ? '0' : '1',
      label: s.trying ? 'מתחבר…' : 'נסה שוב',
      busy: s.trying ? 'true' : 'false',
      codeAnim: s.n > 0 ? 'sf-shake' + alt(s.n) + ' .32s ease-in-out' : 'none',
      hasTries: !s.trying && s.tries > 1,
      tries: String(s.tries),
      triesAnim: 'sf-tick' + alt(s.tries) + ' .32s cubic-bezier(.2,.8,.2,1) both',
      retry: () => this.retry()
    };
  }
}
</script>
