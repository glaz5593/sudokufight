<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { t: 0, cyc: 0 };

  componentDidMount() {
    this.timer = setInterval(() => this.step(), 100);
  }

  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  }

  step() {
    const s = this.state;
    if (!s) return;
    const t = s.t + 100;
    if (t >= 4400) {
      this.setState({ t: 0, cyc: s.cyc + 1 });
      return;
    }
    this.setState({ t: t });
  }

  boxes(cyc) {
    const SOL = '864371259325849761971265843436192587198657432257483916689734125713528694542916378';
    const OWN = '00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.';
    const alt = cyc % 2 ? '-b' : '';
    const out = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        cells.push({ v: OWN[i] === 'g' ? SOL[i] : '', bg: bx % 2 === 1 ? '#ece8fb' : '#fbfaff' });
      }
      const delay = (0.25 + bx * 0.12).toFixed(2);
      out.push({ bx: bx, cells: cells, anim: 'sf-pop' + alt + ' .42s cubic-bezier(.34,1.56,.64,1) ' + delay + 's both' });
    }
    return out;
  }

  renderVals() {
    const s = this.state || { t: 0, cyc: 0 };
    const t = s.t;
    const pct = Math.min(100, Math.round(t / 3000 * 100));
    const STEPS = ['מתחבר לשרת המשחק…', 'מוריד את הלוח…', 'מסנכרן ניקוד וטיימרים…', 'מוכן!'];
    const idx = t < 900 ? 0 : (t < 1900 ? 1 : (t < 3000 ? 2 : 3));
    const ready = idx === 3;
    const key = s.cyc * 4 + idx;
    return {
      boxes: this.boxes(s.cyc),
      pct: pct + '%',
      pctNum: String(pct),
      step: STEPS[idx],
      busy: !ready,
      ready: ready,
      stepColor: ready ? '#3ff0a6' : '#cfc8ee',
      stepAnim: 'sf-tick' + (key % 2 ? '-b' : '') + ' .28s cubic-bezier(.2,.8,.2,1) both',
      boardGlow: ready ? '0 4px 0 #07050f, 0 0 0 2px #ffd23f, 0 0 26px rgba(255,210,63,.45)' : '0 4px 0 #07050f, 0 12px 26px rgba(5,3,15,.5)'
    };
  }
}
</script>
