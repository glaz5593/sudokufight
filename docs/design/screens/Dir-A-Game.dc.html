<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fixture() {
    return {
      CURRENT: '864370209325009061970060043036002087198657402057083000680004105013508690542916370',
      OWNER: '00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.',
      WRONG: [{ i: 4, d: 5, seat: 1 }, { i: 44, d: 3, seat: 0 }, { i: 63, d: 4, seat: 1 }],
      SELECTIONS: [{ seat: 0, i: 52, cell: 'F8', secs: 7, total: 12 }, { seat: 1, i: 7, cell: 'A8', secs: 9, total: 12 }]
    };
  }

  board() {
    const F = this.fixture();
    const P = [
      { tint: '#dcebff', digit: '#1d5fa8', ring: '#4aa8ff' },
      { tint: '#ffe6d8', digit: '#a3471b', ring: '#ff8a4c' }
    ];
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = F.CURRENT[i] === '0' ? '' : F.CURRENT[i];
        const own = F.OWNER[i];
        const sel = F.SELECTIONS.filter(s => s.i === i)[0];
        let bg = (bx % 2 === 1) ? '#ebebe7' : '#f5f5f3';
        let fg = '#111214';
        let ring = 'none';
        let anim = 'none';
        if (own === '0' || own === '1') {
          const pc = P[Number(own)];
          bg = pc.tint;
          fg = pc.digit;
        }
        if (sel) {
          bg = '#ffffff';
          ring = 'inset 0 0 0 3px ' + P[sel.seat].ring;
          if (sel.seat === 0) anim = 'sfa-lock 1.6s ease-in-out infinite';
        }
        const w = F.WRONG.filter(x => x.i === i).map(x => String(x.d));
        cells.push({
          v: v,
          bg: bg,
          fg: fg,
          ring: ring,
          anim: anim,
          hasWrong: w.length > 0,
          wrong: w.join(' '),
          mine: !!sel && sel.seat === 0,
          opp: !!sel && sel.seat === 1,
          secs: sel ? String(sel.secs) : ''
        });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }

  keys() {
    const F = this.fixture();
    const rem = [9, 9, 9, 9, 9, 9, 9, 9, 9];
    for (let j = 0; j < 81; j++) {
      if (F.CURRENT[j] !== '0') rem[Number(F.CURRENT[j]) - 1]--;
    }
    const armed = F.SELECTIONS.some(s => s.seat === 0);
    const keys = [];
    for (let d = 1; d <= 9; d++) {
      const left = rem[d - 1];
      keys.push({
        d: String(d),
        left: String(left),
        op: left > 0 ? '1' : '.3',
        bd: armed ? 'rgba(74,168,255,.55)' : '#2c2f36',
        aria: 'ספרה ' + d + ' · נותרו ' + left
      });
    }
    return keys;
  }

  renderVals() {
    return { boxes: this.board(), keys: this.keys() };
  }
}
</script>
