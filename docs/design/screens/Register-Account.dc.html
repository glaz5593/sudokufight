<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { agree: false, nudge: 0, show: false };

  renderVals() {
    const s = this.state;
    const err = s.nudge > 0 && !s.agree;
    return {
      agree: s.agree,
      notAgree: !s.agree,
      showErr: err,
      rowAnim: err ? (s.nudge % 2 === 1 ? 'sf-shake 300ms ease' : 'sf-shake-b 300ms ease') : 'none',
      rowBg: err ? 'rgba(255,51,85,.08)' : (s.agree ? 'rgba(63,240,166,.06)' : '#151028'),
      rowBorder: err ? '#ff3355' : (s.agree ? 'rgba(63,240,166,.55)' : '#342a5e'),
      boxBg: s.agree ? '#ffd23f' : '#251d45',
      boxBorder: s.agree ? '#ffd23f' : (err ? '#ff3355' : '#a79fcb'),
      pwType: s.show ? 'text' : 'password',
      eyeLabel: s.show ? 'הסתר סיסמה' : 'הצג סיסמה',
      eyePressed: s.show ? 'true' : 'false',
      eyeOpen: !s.show,
      eyeOff: s.show,
      toggle: () => this.setState({ agree: !this.state.agree, nudge: 0 }),
      nudge: () => this.setState({ nudge: this.state.nudge + 1 }),
      toggleEye: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
