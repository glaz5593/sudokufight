<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'normal';
    const INFO = {
      fast: { name: 'מהיר', rating: '1342' },
      normal: { name: 'רגיל', rating: '1287' },
      hard: { name: 'קשה', rating: '1198' }
    };
    const card = (id) => {
      const on = sel === id;
      return {
        sel: on,
        checked: on ? 'true' : 'false',
        border: on ? '#ffd23f' : '#342a5e',
        bg: on ? 'linear-gradient(160deg, #34295f 0%, #221a46 55%, #1b1533 100%)' : 'linear-gradient(160deg, #221a40 0%, #1b1533 100%)',
        shadow: on ? '0 0 0 1px #ffd23f, 0 0 26px rgba(255,210,63,.32), 0 5px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.14)' : '0 5px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.06)',
        wm: on ? 'rgba(255,210,63,.08)' : 'rgba(255,255,255,.04)',
        radioBg: on ? '#ffd23f' : 'transparent',
        radioBorder: on ? '#ffd23f' : '#6c5fa6',
        checkOp: on ? '1' : '0',
        pick: () => this.setState({ sel: id })
      };
    };
    const cur = INFO[sel] || INFO.normal;
    return {
      fast: card('fast'),
      normal: card('normal'),
      hard: card('hard'),
      selName: cur.name,
      selRating: cur.rating
    };
  }
}
</script>
</body>
