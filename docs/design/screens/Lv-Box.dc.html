<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Level 13 (a box level of chapter 2 on the Main map, "Pip מאתגר"; a replay): type 3, "fill the box". Chapters 1-2:
  // 4 cells of the box are missing (D8 E8 E9 F7); 3 stars up to 10 s, 2 up to 15 s, 1 = done by 20 s (the level's end).
  // Board: not a ranked-bank solution (bank #1 relabelled and transposed). 66 givens around box 6, 6 holes outside
  // (B2 C1 E2 H9 I7 I8: dimmed, not selectable); box 6 gives D7 6, D9 5, E7 3, F8 9, F9 4. Unique, checked.
  // At the start D8 (8), E9 (7) and F7 (2) are naked singles; E8 can be 1 or 8 until D8 is in, then only 1 (checked).
  // State at 0:09 (4 s + 5 s penalty): I tried 8 in E8 (wrong: E8 is 1), then placed D8 8; now E8 is selected again
  // and 8 is disabled there [D12]. Still open: E8 1, E9 7, F7 2. 3 stars for one more second.
  fixture() {
    return {
      GIV: '146793528708516943093824761417932605902465300635178094874659132259341870361287009',
      SOL: '146793528728516943593824761417932685982465317635178294874659132259341876361287459',
      MINE: ['D8'],
      BOX: 5,
      SEL: 'E8',
      WRONG: { E8: '8' }
    };
  }

  ix(n) { return 'ABCDEFGHI'.indexOf(n.charAt(0)) * 9 + Number(n.charAt(1)) - 1; }

  boxes() {
    const F = this.fixture();
    const mine = F.MINE.map(n => this.ix(n));
    const sel = this.ix(F.SEL);
    const wrong = {};
    Object.keys(F.WRONG).forEach(n => { wrong[this.ix(n)] = F.WRONG[n]; });
    const P1 = { tint: '#d6f4fc', digit: '#0b6a85', shape: 'M12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16z' };
    const out = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const inBox = bx === F.BOX;
        const given = F.GIV.charAt(i) !== '0';
        const isMine = mine.indexOf(i) >= 0;
        let bg = bx % 2 ? '#eceff4' : '#f7f8fa';
        let fg = '#0f1218', fw = '600', v = given ? F.GIV.charAt(i) : '';
        if (!given && !inBox) bg = '#cfd4dc';
        if (inBox) bg = '#dfe3ec';
        if (isMine) { bg = P1.tint; fg = P1.digit; fw = '500'; v = F.SOL.charAt(i); }
        if (i === sel) bg = P1.tint;
        cells.push({
          v: v, bg: bg, fg: fg, fw: fw, owned: isMine, shape: P1.shape,
          ring: i === sel ? 'inset 0 0 0 3px #36c9f0' : 'none',
          hasWrong: !!wrong[i], wrong: wrong[i] || ''
        });
      }
      out.push({ cells: cells });
    }
    return out;
  }

  keys() {
    const F = this.fixture();
    // digits already in box 6: its givens and mine
    const placed = [];
    for (let k = 0; k < 9; k++) {
      const i = (Math.floor(F.BOX / 3) * 3 + Math.floor(k / 3)) * 9 + (F.BOX % 3) * 3 + (k % 3);
      if (F.GIV.charAt(i) !== '0') placed.push(F.GIV.charAt(i));
    }
    F.MINE.forEach(n => placed.push(F.SOL.charAt(this.ix(n))));
    const blocked = F.WRONG[F.SEL] || '';
    const out = [];
    for (let d = 1; d <= 9; d++) {
      const s = String(d);
      const used = placed.indexOf(s) >= 0;
      const isBlocked = s === blocked;
      out.push({
        d: s,
        left: used ? '0' : '1',
        op: (used || isBlocked) ? '.3' : '1',
        isBlocked: isBlocked,
        notBlocked: !isBlocked,
        ariaDis: (used || isBlocked) ? 'true' : 'false',
        aria: isBlocked ? 'ספרה ' + s + ' · כבר נוסתה ב־' + F.SEL
          : (used ? 'ספרה ' + s + ' · כבר בריבוע' : 'ספרה ' + s + ' · עוד חסרה בריבוע')
      });
    }
    return out;
  }

  renderVals() {
    return { boxes: this.boxes(), keys: this.keys() };
  }
}
</script>
