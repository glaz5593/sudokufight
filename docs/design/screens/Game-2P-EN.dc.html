        <span style="display: block; font-family: Teko, Rubik, sans-serif; font-weight: 600; font-size: 34px; line-height: .8; padding-top: 5px;">{{k.d}}</span>
        <span style="display: block; font: 600 9px/1 Rubik, sans-serif; color: #a79fcb;">{{k.left}}</span>

  <button type="button" class="sf-press" style="position: absolute; top: 746px; left: 16px; width: 358px; height: 48px; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #251d45; border: 2px solid #4b3f80; border-radius: 10px; transform: skewX(-9deg); box-shadow: 0 5px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.08); color: #f1eeff; cursor: pointer;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  board() {
    const CURRENT = '864370209325009061970060043036002087198657402057083000680004105013508690542916370';
    const OWNER = '00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.';
    const WRONG = [{ i: 4, d: 5, seat: 1 }, { i: 44, d: 3, seat: 0 }, { i: 63, d: 4, seat: 1 }];
    const MINE = { i: 52, secs: 7, total: 12 };
    const NINA = { i: 7, secs: 9, total: 12 };
    const P = [
      { tint: '#d3f8ff', solve: '#006b8a', deep: '#0098c2', clip: 'circle(50%)' },
      { tint: '#ffe6cf', solve: '#9a3f00', deep: '#c95600', clip: 'polygon(50% 0, 100% 100%, 0 100%)' }
    ];
    const R = i => Math.floor(i / 9), C = i => i % 9, B = i => Math.floor(R(i) / 3) * 3 + Math.floor(C(i) / 3);
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = CURRENT[i] === '0' ? '' : CURRENT[i];
        const o = OWNER[i];
        const shaded = bx % 2 === 1;
        const isMine = i === MINE.i, isNina = i === NINA.i;
        const peer = !isMine && (R(i) === R(MINE.i) || C(i) === C(MINE.i) || B(i) === B(MINE.i));
        let bg = shaded ? '#ece8fb' : '#fbfaff';
        let fg = '#1a1433', ring = 'none', anim = 'none', glyph = '', clip = 'none';
        if (peer) bg = shaded ? '#dfd7fb' : '#e9e3ff';
        if (o === '0' || o === '1') {
          const pc = P[Number(o)];
          bg = pc.tint; fg = pc.solve; glyph = pc.deep; clip = pc.clip;
        }
        if (isMine) { bg = '#c8f6ff'; ring = 'inset 0 0 0 3px #2ee6ff'; anim = 'sf-lock-me 1.4s ease-in-out infinite'; }
        if (isNina) { bg = 'repeating-linear-gradient(135deg, #ffe6cf 0 4px, #fbfaff 4px 8px)'; ring = 'inset 0 0 0 3px #ff8a1f'; anim = 'sf-lock-nina 1.8s ease-in-out infinite'; }
        const w = WRONG.filter(x => x.i === i).map(x => String(x.d));
        const name = 'ABCDEFGHI'[R(i)] + String(C(i) + 1);
        cells.push({
          i: i, v: v, bg: bg, fg: fg, ring: ring, anim: anim, glyph: glyph, clip: clip,
          hasGlyph: !!glyph,
          hasWrong: w.length > 0,
          wrong: w.join(' '),
          wb: isMine ? '8px' : '2px',
          mineSel: isMine,
          ninaSel: isNina,
          secs: isMine ? String(MINE.secs) : (isNina ? String(NINA.secs) : ''),
          barW: Math.round(MINE.secs / MINE.total * 100) + '%',
          aria: name + (v ? ' · ' + v : '') + (isMine ? ' · locked by you' : '') + (isNina ? ' · locked by NinaVolt' : '')
        });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }

  keys() {
    const CURRENT = '864370209325009061970060043036002087198657402057083000680004105013508690542916370';
    const rem = [9, 9, 9, 9, 9, 9, 9, 9, 9];
    for (let j = 0; j < 81; j++) {
      if (CURRENT[j] !== '0') rem[Number(CURRENT[j]) - 1]--;
    }
    const out = [];
    for (let d = 1; d <= 9; d++) {
      out.push({ d: String(d), left: String(rem[d - 1]), op: rem[d - 1] > 0 ? '1' : '.3', aria: 'Digit ' + d + ' · ' + rem[d - 1] + ' left' });
    }
    return out;
  }

  renderVals() {
    const railTop = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => {
      const c = g * 3 + k;
      return { t: String(c + 1), color: c === 7 ? '#2ee6ff' : '#a79fcb' };
    }) }));
    const railSide = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => {
      const r = g * 3 + k;
      return { t: 'ABCDEFGHI'[r], color: r === 5 ? '#2ee6ff' : '#a79fcb' };
    }) }));
    return { boxes: this.board(), keys: this.keys(), railTop: railTop, railSide: railSide };
  }
}
</script>
