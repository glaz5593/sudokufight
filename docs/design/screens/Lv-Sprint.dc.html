  // 12 s locks, NO interferences (none in levels). The level ends at 30 points or at 30 s: 19 s gone, 11 left.
  // Board: 37 givens, unique solution, not a ranked-bank solution.
  // Moves so far, scored with the engine formula (§6.4) on the board before each move; every one was a single then:
  //   me F4=7 +7.5 · bot A7=9 +4.5 · me G6=6 +4.5 · me G4: typed 1, right is 9 -> -3 (what the 9 was worth, §6.5)
  //   · me D5=8 +6  => me 15, Biscuit 4.5 (one move: 11-18 s a move at x0.9), lead 10.5 = 2 stars now, 3 from 15.
  //   I hold C9 (5, worth 6.5, a hidden single in row C): 7 of 12 s left. Biscuit thinks about A5 (1, a hidden single).

    return {
      PUZ: '003605004046079021910800300002001697005094000089003000304000000760058009098037050',
      SOL: '823615974546379821917842365432581697675294183189763542354926718761458239298137456',
      ME: ['F4', 'G6', 'D5'],
      BOT: ['A7'],
      WRONG: { G4: '1' },
      MYLOCK: { cell: 'C9', secs: 7 },
      BOTLOCK: 'A5'
    };
  }

  ix(n) { return 'ABCDEFGHI'.indexOf(n.charAt(0)) * 9 + Number(n.charAt(1)) - 1; }

  grid() {
    const F = this.fixture();
    const own = {};
    F.ME.forEach(n => { own[this.ix(n)] = 0; });
    F.BOT.forEach(n => { own[this.ix(n)] = 1; });
    const g = [];
    for (let i = 0; i < 81; i++) {
      const given = F.PUZ.charAt(i) !== '0';
      g.push({ v: given ? F.PUZ.charAt(i) : (own[i] !== undefined ? F.SOL.charAt(i) : ''), own: own[i] });
    }
    return g;
  }

  boxes() {
    const F = this.fixture();
    const g = this.grid();
    const P = [
      { tint: '#d6f4fc', digit: '#0b6a85', shape: 'M12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16z' },
      { tint: '#ffe8d4', digit: '#9a4a0c', shape: 'M12 4l8 15H4z' }
    ];
    const myLock = this.ix(F.MYLOCK.cell), botLock = this.ix(F.BOTLOCK);
    const wrong = {};
    Object.keys(F.WRONG).forEach(n => { wrong[this.ix(n)] = F.WRONG[n]; });
    const out = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const c = g[i];
        const owned = c.own !== undefined;
        let bg = bx % 2 ? '#eceff4' : '#f7f8fa', ring = 'none', anim = 'none';
        if (owned) bg = P[c.own].tint;
        if (i === myLock) { bg = P[0].tint; ring = 'inset 0 0 0 3px #36c9f0'; anim = 'sf-lock 1.6s ease-in-out infinite'; }
        if (i === botLock) ring = 'inset 0 0 0 3px #ff9440';
        cells.push({
          v: c.v, bg: bg, ring: ring, anim: anim,
          fg: owned ? P[c.own].digit : '#0f1218', fw: owned ? '500' : '600',
          owned: owned, shape: owned ? P[c.own].shape : '',
          hasWrong: !!wrong[i], wrong: wrong[i] || '',
          myLock: i === myLock, secs: String(F.MYLOCK.secs),
          botLock: i === botLock
        });
      }
      out.push({ cells: cells });
    }
    return out;
  }

  keys() {
    const g = this.grid();
    const out = [];
    for (let d = 1; d <= 9; d++) {
      const s = String(d);
      let left = 9;
      for (let i = 0; i < 81; i++) { if (g[i].v === s) left--; }
      out.push({ d: s, left: String(left), op: left > 0 ? '1' : '.3', aria: 'ספרה ' + d + ' · נותרו ' + left });
    }
    return out;
  }

  renderVals() {
    return { boxes: this.boxes(), keys: this.keys() };
  }
}
</script>
