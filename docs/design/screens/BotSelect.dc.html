<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'hoot';
    const seg = (n, c) => [0, 1, 2, 3, 4].map(k => ({ c: k < n ? c : '#342a5e' }));
    const SPD = '#ffd23f', ACC = '#3ff0a6', AGG = '#ff3355';
    const bot = (id, s, a, g) => {
      const on = sel === id;
      return {
        sel: on,
        checked: on ? 'true' : 'false',
        border: on ? '#ffd23f' : '#342a5e',
        bg: on ? 'linear-gradient(160deg, #34295f 0%, #221a46 55%, #1b1533 100%)' : 'linear-gradient(160deg, #211a3f 0%, #1a1432 100%)',
        shadow: on ? '0 0 0 1px #ffd23f, 0 0 24px rgba(255,210,63,.30), 0 5px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.14)' : '0 4px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.06)',
        frame: on ? '#ffd23f' : '#4b3f80',
        frameDeep: on ? '#e8a100' : '#07050f',
        wm: on ? 'rgba(255,210,63,.09)' : 'rgba(255,255,255,.04)',
        anim: on ? 'sf-bob 2.8s ease-in-out infinite' : 'none',
        spd: seg(s, SPD),
        acc: seg(a, ACC),
        agg: seg(g, AGG),
        pick: () => this.setState({ sel: id })
      };
    };
    return {
      pip: bot('pip', 1, 1, 0),
      biscuit: bot('biscuit', 2, 2, 1),
      hoot: bot('hoot', 3, 3, 2),
      maestro: bot('maestro', 4, 4, 3),
      overlord: bot('overlord', 5, 5, 5)
    };
  }
}
