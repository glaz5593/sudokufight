<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  cur() {
    return '864370209325009061970060043036002087198657402057083000680004105013508690542916370';
  }

  board() {
    const CUR = this.cur();
    const OWN = '00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.';
    const WRONG = [{ i: 4, d: 5 }, { i: 44, d: 3 }, { i: 63, d: 4 }];
    const P = [
      { tint: '#d3f8ff', solve: '#006b8a', deep: '#0098c2', clip: 'circle(50%)' },
      { tint: '#ffe6cf', solve: '#9a3f00', deep: '#c95600', clip: 'polygon(50% 0, 100% 100%, 0 100%)' }
    ];
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = CUR[i] === '0' ? '' : CUR[i];
        const o = OWN[i];
        let bg = bx % 2 === 1 ? '#ece8fb' : '#fbfaff';
        let fg = '#1a1433', glyph = '', clip = 'none';
        if (o === '0' || o === '1') {
          const pc = P[Number(o)];
          bg = pc.tint; fg = pc.solve; glyph = pc.deep; clip = pc.clip;
        }
        const w = WRONG.filter(x => x.i === i).map(x => String(x.d));
        cells.push({ v: v, bg: bg, fg: fg, glyph: glyph, clip: clip, hasGlyph: !!glyph, hasWrong: w.length > 0, wrong: w.join(' ') });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }

  renderVals() {
    const keys = [];
    for (let d = 1; d <= 9; d++) keys.push({ d: String(d) });
    return {
      boxes: this.board(),
      keys: keys
    };
  }
}
</script>
