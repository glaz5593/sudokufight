<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  cur() {
    return '864370209325009061970060043036002087198657402057083000680004105013508690542916370';
  }

  owner() {
    return '00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.';
  }

  board() {
    const CURRENT = this.cur();
    const OWNER = this.owner();
    const WRONG = [{ i: 4, d: 5, seat: 1 }, { i: 44, d: 3, seat: 0 }, { i: 63, d: 4, seat: 1 }];
    const SELECTIONS = [{ seat: 0, i: 52, secs: 7, total: 12 }, { seat: 1, i: 7, secs: 5, total: 12 }];
    const P = [
      { ring: '#2b59ff', tint: '#e3eaff', digit: '#1f45cc' },
      { ring: '#f0662a', tint: '#ffe9df', digit: '#b8461a' }
    ];
    const RAD = { 0: '9.5px 0 0 0', 2: '0 9.5px 0 0', 6: '0 0 0 9.5px', 8: '0 0 9.5px 0' };
    const mine = SELECTIONS.find(s => s.seat === 0);
    const r = i => Math.floor(i / 9), c = i => i % 9, b = i => Math.floor(r(i) / 3) * 3 + Math.floor(c(i) / 3);
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = CURRENT[i] === '0' ? '' : CURRENT[i];
        const own = OWNER[i];
        const owned = own === '0' || own === '1';
        const sel = SELECTIONS.find(s => s.i === i);
        const peer = !!mine && i !== mine.i && (r(i) === r(mine.i) || c(i) === c(mine.i) || b(i) === b(mine.i));
        let bg = (bx % 2 === 1) ? '#f3f4f7' : '#ffffff';
        let fg = '#0f1115', ring = 'none', anim = 'none';
        if (peer && !owned) bg = '#eef2ff';
        if (owned) { bg = P[Number(own)].tint; fg = P[Number(own)].digit; }
        if (sel && sel.seat === 0) { bg = '#ffffff'; ring = 'inset 0 0 0 2.5px ' + P[0].ring; anim = 'sfb-lock 1.6s ease-in-out infinite'; }
        if (sel && sel.seat === 1) { bg = '#fff4ef'; ring = 'inset 0 0 0 2.5px ' + P[1].ring; }
        const w = WRONG.filter(x => x.i === i).map(x => String(x.d));
        cells.push({
          i: i,
          v: v,
          bg: bg,
          fg: fg,
          ring: ring,
          anim: anim,
          hasWrong: w.length > 0,
          wrong: w.join(' '),
          mineSel: !!sel && sel.seat === 0,
          oppSel: !!sel && sel.seat === 1,
          secs: sel ? String(sel.secs) : ''
        });
      }
      boxes.push({ bx: bx, rad: RAD[bx] || '0', cells: cells });
    }
    return boxes;
  }

  keys() {
    const CURRENT = this.cur();
    const rem = [9, 9, 9, 9, 9, 9, 9, 9, 9];
    for (let j = 0; j < 81; j++) {
      if (CURRENT[j] !== '0') rem[Number(CURRENT[j]) - 1]--;
    }
    const armed = true;
    const out = [];
    for (let d = 1; d <= 9; d++) {
      const left = rem[d - 1];
      out.push({
        d: String(d),
        left: String(left),
        op: left > 0 ? '1' : '.35',
        bd: armed ? 'rgba(43,89,255,.55)' : '#e2e5ea',
        aria: 'ספרה ' + d + ' · נותרו ' + left
      });
    }
    return out;
  }

  renderVals() {
    return { boxes: this.board(), keys: this.keys() };
  }
}
</script>
