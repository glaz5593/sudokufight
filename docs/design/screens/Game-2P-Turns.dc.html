              <span style="position: absolute; left: 4px; right: 4px; bottom: 4px; height: 3px; border-radius: 2px; background: rgba(0,152,194,.22);">
                <span style="display: block; height: 3px; width: {{cell.barW}}; border-radius: 2px; background: #2ee6ff;"></span>
              </span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- ===== KEYPAD (armed) ===== -->
  <div dir="ltr" style="position: absolute; top: 666px; left: 16px; width: 358px; display: flex; gap: 4px;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
      <button type="button" aria-label="{{k.aria}}" style="flex: 1 1 0; min-width: 0; height: 62px; margin: 0; padding: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #251d45; border: 2px solid {{k.bd}}; border-radius: 10px; box-shadow: {{k.sh}}; opacity: {{k.op}}; color: #f1eeff; cursor: pointer;">
        <span style="display: block; font-family: Teko, Rubik, sans-serif; font-weight: 600; font-size: 34px; line-height: .8; padding-top: 5px;">{{k.d}}</span>
        <span style="display: block; font: 600 9px/1 Rubik, sans-serif; color: #a79fcb;">{{k.left}}</span>
      </button>
    </sc-for>
  </div>

  <button type="button" style="position: absolute; top: 746px; left: 16px; width: 358px; height: 48px; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #251d45; border: 2px solid #4b3f80; border-radius: 10px; transform: skewX(-9deg); box-shadow: 0 5px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.08); color: #f1eeff; cursor: pointer;">
    <span style="display: flex; align-items: center; gap: 8px; transform: skewX(9deg); font: 600 17px/1 Rubik, sans-serif; white-space: nowrap;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 9l6 6M15 9l-6 6"></path></svg>
      ביטול בחירה
      <span dir="ltr" style="display: block; padding: 3px 6px 0; border-radius: 5px; background: rgba(46,230,255,.14); border: 1px solid rgba(46,230,255,.6); color: #2ee6ff; font-family: Teko, Rubik, sans-serif; font-weight: 600; font-size: 17px; line-height: 17px;">F8</span>
    </span>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  scenario() {
    // ranked2p in the TURN-BASED variant (open decision D1): my turn, I hold F8 with 9 of 12 s left.
    // NinaVolt holds nothing — she waits for her turn.
    return {
      CURRENT: "864370209325009061970060043036002087198657402057083000680004105013508690542916370",
      OWNER: "00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.",
      WRONG: [{ i: 4, d: 5, seat: 1 }, { i: 44, d: 3, seat: 0 }, { i: 63, d: 4, seat: 1 }],
      MINE: { i: 52, secs: 9, total: 12 }
    };
  }
  board() {
    const S = this.scenario();
    const P = [
      { p: '#2ee6ff', deep: '#0098c2', tint: '#d3f8ff', solve: '#006b8a', clip: 'circle(50%)' },
      { p: '#ff8a1f', deep: '#c95600', tint: '#ffe6cf', solve: '#9a3f00', clip: 'polygon(50% 0, 100% 100%, 0 100%)' }
    ];
    const R = i => Math.floor(i / 9), C = i => i % 9, B = i => Math.floor(R(i) / 3) * 3 + Math.floor(C(i) / 3);
    const mine = S.MINE;
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = S.CURRENT[i] === '0' ? '' : S.CURRENT[i];
        const o = S.OWNER[i];
        const shaded = bx % 2 === 1;
        const isMine = !!mine && mine.i === i;
        const peer = !!mine && !isMine && (R(i) === R(mine.i) || C(i) === C(mine.i) || B(i) === B(mine.i));
        let bg = shaded ? '#ece8fb' : '#fbfaff', fg = '#1a1433', ring = 'none', anim = 'none', glyph = '', clip = 'none';
        if (peer) bg = shaded ? '#dfd7fb' : '#e9e3ff';
        if (o === '0' || o === '1') { const pc = P[Number(o)]; bg = pc.tint; fg = pc.solve; glyph = pc.deep; clip = pc.clip; }
        if (isMine) { bg = '#c8f6ff'; ring = 'inset 0 0 0 3px #2ee6ff'; anim = 'sf-lock-me 1.4s ease-in-out infinite'; }
        const w = S.WRONG.filter(x => x.i === i).map(x => String(x.d));
        const name = 'ABCDEFGHI'[R(i)] + String(C(i) + 1);
        cells.push({
          v: v, bg: bg, fg: fg, ring: ring, anim: anim, glyph: glyph, clip: clip,
          hasGlyph: !!glyph, hasWrong: w.length > 0, wrong: w.join(' '), wb: isMine ? '8px' : '2px',
          mineSel: isMine, secs: isMine ? String(mine.secs) : '',
          barW: isMine ? Math.round(mine.secs / mine.total * 100) + '%' : '0%',
          aria: name + (v ? ' · ' + v : '') + (isMine ? ' · נבחרה' : '')
        });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }
  rails() {
    const mine = this.scenario().MINE;
    const top = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => ({ t: String(g * 3 + k + 1), color: mine && mine.i % 9 === g * 3 + k ? '#2ee6ff' : '#a79fcb' })) }));
    const side = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => ({ t: 'ABCDEFGHI'[g * 3 + k], color: mine && Math.floor(mine.i / 9) === g * 3 + k ? '#2ee6ff' : '#a79fcb' })) }));
    return { top: top, side: side };
  }
  keys() {
    const S = this.scenario();
    const out = [];
    for (let d = 1; d <= 9; d++) {
      const ch = String(d);
      let left = 9;
      for (let i = 0; i < 81; i++) { if (S.CURRENT[i] === ch) left--; }
      out.push({
        d: ch, left: String(left), aria: 'ספרה ' + d + ' · נותרו ' + left,
        op: left > 0 ? '1' : '.3',
        bd: 'rgba(46,230,255,.6)',
        sh: '0 4px 0 #07050f, inset 0 2px 0 rgba(46,230,255,.35)'
      });
    }
    return out;
  }
  renderVals() {
    const rails = this.rails();
    return { boxes: this.board(), railTop: rails.top, railSide: rails.side, keys: this.keys() };
  }
}
</script>
