<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  board() {
    const SOLUTION = "864371259325849761971265843436192587198657432257483916689734125713528694542916378";
    const OWNER = "00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.";
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        cells.push({ i: i, v: OWNER[i] === 'g' ? SOLUTION[i] : '', bg: (bx % 2 === 1) ? '#ece8fb' : '#fbfaff' });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }
  keys() {
    const SOLUTION = "864371259325849761971265843436192587198657432257483916689734125713528694542916378";
    const OWNER = "00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.";
    const keys = [];
    for (let d = 1; d <= 9; d++) {
      let given = 0;
      for (let i = 0; i < 81; i++) {
        if (OWNER[i] === 'g' && SOLUTION[i] === String(d)) given++;
      }
      keys.push({ d: String(d), left: String(9 - given) });
    }
    return keys;
  }
  renderVals() {
    const on = { bg: '#ffd23f', fg: '#1a1000', bd: '#ffd23f', sh: '0 3px 0 #b37b00, 0 0 16px rgba(255,210,63,.6)' };
    const off = { bg: '#1b1533', fg: '#a79fcb', bd: '#4b3f80', sh: '0 3px 0 #07050f' };
    const steps = [
      Object.assign({ label: '3', sep: true }, on),
      Object.assign({ label: '2', sep: true }, off),
      Object.assign({ label: '1', sep: true }, off),
      Object.assign({ label: 'GO', sep: false }, off)
    ];
    return { boxes: this.board(), keys: this.keys(), steps: steps };
  }
}
