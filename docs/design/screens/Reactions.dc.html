<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = {
    open: true,
    page: 0,
    sent: { e: '😎', n: 0, live: false },
    nina: { e: '😱', n: 0 }
  };

  componentWillUnmount() {
    if (this.replyTimer) clearTimeout(this.replyTimer);
    this.replyTimer = null;
  }

  cur() {
    return '864370209325009061970060043036002087198657402057083000680004105013508690542916370';
  }

  board() {
    const CUR = this.cur();
    const OWN = '00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.';
    const WRONG = [{ i: 4, d: 5, seat: 1 }, { i: 44, d: 3, seat: 0 }, { i: 63, d: 4, seat: 1 }];
    const ME = { i: 52, secs: 7, total: 12 };
    const NINA = { i: 7, secs: 5, total: 12 };
    const P = [
      { tint: '#d3f8ff', solve: '#006b8a', deep: '#0098c2', clip: 'circle(50%)' },
      { tint: '#ffe6cf', solve: '#9a3f00', deep: '#c95600', clip: 'polygon(50% 0, 100% 100%, 0 100%)' }
    ];
    const R = i => Math.floor(i / 9), C = i => i % 9, B = i => Math.floor(R(i) / 3) * 3 + Math.floor(C(i) / 3);
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = CUR[i] === '0' ? '' : CUR[i];
        const o = OWN[i];
        const shaded = bx % 2 === 1;
        const isMe = i === ME.i, isNina = i === NINA.i;
        const peer = !isMe && (R(i) === R(ME.i) || C(i) === C(ME.i) || B(i) === B(ME.i));
        let bg = shaded ? '#ece8fb' : '#fbfaff', fg = '#1a1433', ring = 'none', anim = 'none', glyph = '', clip = 'none';
        if (peer) bg = shaded ? '#dfd7fb' : '#e9e3ff';
        if (o === '0' || o === '1') {
          const pc = P[Number(o)];
          bg = pc.tint; fg = pc.solve; glyph = pc.deep; clip = pc.clip;
        }
        if (isMe) { bg = '#c8f6ff'; ring = 'inset 0 0 0 3px #2ee6ff'; anim = 'sf-lock-me 1.4s ease-in-out infinite'; }
        if (isNina) { bg = 'repeating-linear-gradient(135deg, #ffe6cf 0 4px, #fbfaff 4px 8px)'; ring = 'inset 0 0 0 3px #ff8a1f'; anim = 'sf-lock-nina 1.8s ease-in-out infinite'; }
        const w = WRONG.filter(x => x.i === i).map(x => String(x.d));
        cells.push({
          v: v, bg: bg, fg: fg, ring: ring, anim: anim, glyph: glyph, clip: clip,
          hasGlyph: !!glyph,
          hasWrong: w.length > 0,
          wrong: w.join(' '),
          wb: isMe ? '8px' : '2px',
          mineSel: isMe,
          ninaSel: isNina,
          secs: isMe ? String(ME.secs) : (isNina ? String(NINA.secs) : ''),
          barW: Math.round(ME.secs / ME.total * 100) + '%'
        });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }

  keys() {
    const CUR = this.cur();
    const rem = [9, 9, 9, 9, 9, 9, 9, 9, 9];
    for (let j = 0; j < 81; j++) {
      if (CUR[j] !== '0') rem[Number(CUR[j]) - 1]--;
    }
    return rem.map((left, k) => ({
      d: String(k + 1),
      left: String(left),
      op: left > 0 ? '1' : '.3',
      aria: 'ספרה ' + (k + 1) + ' · נותרו ' + left
    }));
  }

  send(e) {
    const n = this.state.sent.n + 1;
    this.setState({ sent: { e: e, n: n, live: true } });
    if (this.replyTimer) clearTimeout(this.replyTimer);
    const REPLY = { '😂': '🤦', '😱': '😂', '😎': '😱', '🤦': '😂', '🔥': '😱', '👀': '👀' };
    this.replyTimer = setTimeout(() => {
      this.replyTimer = null;
      const st = this.state;
      this.setState({ nina: { e: REPLY[e] || '😱', n: st.nina.n + 1 } });
    }, 1500);
  }

  renderVals() {
    const s = this.state;
    const MY_COL = 7, MY_ROW = 5;
    const railTop = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => {
      const c = g * 3 + k;
      return { t: String(c + 1), color: c === MY_COL ? '#2ee6ff' : '#a79fcb' };
    }) }));
    const railSide = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => {
      const r = g * 3 + k;
      return { t: 'ABCDEFGHI'[r], color: r === MY_ROW ? '#2ee6ff' : '#a79fcb' };
    }) }));

    const RX = [['😂', 'צוחק'], ['😱', 'בהלה'], ['😎', 'קול'], ['🤦', 'פאשלה'], ['🔥', 'בוער'], ['👀', 'מסתכל']];
    const reactions = RX.map((x, k) => {
      const on = s.sent.e === x[0];
      return {
        e: x[0],
        label: 'תגובה: ' + x[1],
        sent: on,
        bg: on ? '#3a2f6b' : 'radial-gradient(circle at 50% 30%, #3a2f6b 0%, #251d45 72%)',
        bd: on ? '#ffd23f' : '#4b3f80',
        sh: on ? '0 2px 0 #b37b00, 0 0 0 3px rgba(255,210,63,.2), 0 0 18px rgba(255,210,63,.45)' : '0 3px 0 #07050f, inset 0 1px 0 rgba(255,255,255,.12)',
        lift: on ? 'translateY(2px)' : 'none',
        delay: (k * 0.12).toFixed(2) + 's',
        send: () => this.send(x[0])
      };
    });
    const locked = ['🤯', '🥶', '🙏', '🤩', '😤'].map((e, k) => ({
      e: e,
      label: 'תגובה נעולה · נפתחת ברמה 20',
      delay: (k * 0.04).toFixed(2) + 's'
    }));

    const alt = s.sent.n % 2 ? 'b' : 'a';
    const ease = ' 1.9s cubic-bezier(.2,.8,.2,1) ';
    const fx = {
      e: s.sent.e,
      frozen: !s.sent.live,
      live: !!s.sent.live,
      heroAnim: s.sent.live ? 'sf-emote-' + alt + ease + 'both' : 'sf-bob 2.6s ease-in-out infinite',
      g1Anim: 'sf-emote-' + alt + ease + '.09s both',
      g2Anim: 'sf-emote-' + alt + ease + '.18s both'
    };
    const nb = {
      e: s.nina.e,
      anim: (s.nina.n % 2 ? 'sf-pop-b' : 'sf-pop') + ' .42s cubic-bezier(.34,1.56,.64,1) both, sf-wobble 2.6s ease-in-out .5s infinite'
    };

    return {
      boxes: this.board(),
      railTop: railTop,
      railSide: railSide,
      keys: this.keys(),
      reactions: reactions,
      locked: locked,
      open: !!s.open,
      page0: !!s.open && s.page === 0,
      page1: !!s.open && s.page === 1,
      btn: {
        bg: s.open ? '#342a5e' : '#251d45',
        bd: s.open ? '#ffd23f' : '#4b3f80',
        fg: s.open ? '#ffd23f' : '#f1eeff',
        sh: s.open ? '0 3px 0 #07050f, 0 0 0 2px rgba(255,210,63,.25), 0 0 14px rgba(255,210,63,.35)' : '0 3px 0 #07050f',
        exp: s.open ? 'true' : 'false'
      },
      fx: fx,
      nb: nb,
      toggle: () => this.setState({ open: !this.state.open, page: 0 }),
      more: () => this.setState({ page: 1 }),
      back: () => this.setState({ page: 0 })
    };
  }
}
</script>
</body>
</html>
