<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { show: false };

  renderVals() {
    const show = this.state.show;
    return {
      pwType: show ? 'text' : 'password',
      eyeLabel: show ? 'הסתר סיסמה' : 'הצג סיסמה',
      eyePressed: show ? 'true' : 'false',
      eyeOpen: !show,
      eyeOff: show,
      toggleEye: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
