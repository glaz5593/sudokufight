<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { sel: 0 };

  avatars() {
    return [
      { url: '/_blob/681dc07305326f9b99e5d748fd8030cf', label: 'שועל' },
      { url: '/_blob/f6eda2c838580a98d59a8d414ca447a2', label: 'דמות 1' },
      { url: '/_blob/366dbb9cb5269fdf638d4edcf94e79b5', label: 'חתול' },
      { url: '/_blob/81c5fc644a274381b76e8b0662720cdf', label: 'דמות 2' },
      { url: '/_blob/65600257e61f2f45bd57d93805d8ea40', label: 'דוב' },
      { url: '/_blob/8a99dfc282da92ef2a7a223c7c092be0', label: 'דמות 3' },
      { url: '/_blob/a59c59714dbb1a1e6c0d5224b0700d2e', label: 'קנגורו' },
      { url: '/_blob/4e4ca682d96ea50cbe12ff6c50d0126a', label: 'דמות 4' },
      { url: '/_blob/2251dbb0196f8b4f953439ce65b037df', label: 'חזיר' },
      { url: '/_blob/8df3e811b2f9c6a781056798625de644', label: 'דמות 5' },
      { url: '/_blob/b97a8d1921d51999318eb96b11285c0e', label: 'פרה' },
      { url: '/_blob/86fcf64e7ac336f52b8740c99e6a40ec', label: 'דמות 6' },
      { url: '/_blob/915bf1cad6f33d85ed47da752c1af6d7', label: 'דמות 7' },
      { url: '/_blob/d6153f8f2d28ac4d97060cc7cae9030a', label: 'דמות 8' }
    ];
  }

  renderVals() {
    const LIST = this.avatars();
    const LOCKED = [
      { url: '/_blob/8db57daa2a62a6e3ef970e64e568fbf9', lvl: 'רמה 10', aria: 'זאב, נפתח ברמה 10' },
      { url: '/_blob/0a4f276afd5b82a8c39be5ea21268217', lvl: 'רמה 20', aria: 'פנדה, נפתח ברמה 20' }
    ];
    const n = LIST.length;
    const sel = Math.max(0, Math.min(n - 1, this.state.sel));
    const tiles = LIST.map((a, i) => ({
      url: a.url,
      aria: a.label,
      on: i === sel,
      pressed: i === sel ? 'true' : 'false',
      unlocked: true,
      locked: false,
      lvl: '',
      frame: i === sel ? '#2ee6ff' : '#342a5e',
      shadow: i === sel ? '0 0 0 2px #0f0b1d, 0 0 0 4px rgba(46,230,255,.5), 0 0 18px rgba(46,230,255,.6)' : '0 3px 0 #07050f',
      pick: () => this.setState({ sel: i })
    })).concat(LOCKED.map(l => ({
      url: l.url,
      aria: l.aria,
      on: false,
      pressed: 'false',
      unlocked: false,
      locked: true,
      lvl: l.lvl,
      frame: '#151028',
      shadow: '0 3px 0 #07050f',
      pick: () => {}
    })));
    return {
      tiles,
      selUrl: LIST[sel].url,
      selAlt: 'האווטאר שנבחר: ' + LIST[sel].label,
      selPos: String(sel + 1),
      total: String(n),
      prev: () => this.setState({ sel: (this.state.sel - 1 + n) % n }),
      next: () => this.setState({ sel: (this.state.sel + 1) % n })
    };
  }
}
</script>
</body>
</html>
