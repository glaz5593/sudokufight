            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- ===== WRONG-MOVE FX on F8 (board coordinates): shake ghosts + −2 ===== -->
  <div dir="ltr" aria-hidden="true" style="position: absolute; top: 290px; left: 16px; width: 358px; height: 358px; pointer-events: none; z-index: 6;">
    <span style="position: absolute; left: 272px; top: 199px; width: 38px; height: 38px; box-sizing: border-box; border-radius: 4px; border: 2px solid rgba(255,51,85,.5); background: rgba(255,51,85,.08);"></span>
    <span style="position: absolute; left: 285px; top: 199px; width: 38px; height: 38px; box-sizing: border-box; border-radius: 4px; border: 2px solid rgba(255,51,85,.28);"></span>
    <svg width="12" height="30" viewBox="0 0 12 30" style="position: absolute; left: 258px; top: 203px;"><path d="M10 3Q3 15 10 27M5 8Q1 15 5 22" fill="none" stroke="#ff3355" stroke-width="2" stroke-linecap="round"></path></svg>
    <svg width="12" height="30" viewBox="0 0 12 30" style="position: absolute; left: 325px; top: 203px;"><path d="M2 3Q9 15 2 27M7 8Q11 15 7 22" fill="none" stroke="#ff3355" stroke-width="2" stroke-linecap="round"></path></svg>
    <div style="position: absolute; left: 257px; top: 150px; width: 80px; text-align: center; transform: rotate(6deg);">
      <span style="display: block; font-family: Teko, Rubik, sans-serif; font-weight: 700; font-size: 34px; line-height: 1; color: #ff3355; -webkit-text-stroke: 2px #0f0b1d; paint-order: stroke fill; text-shadow: 0 2px 0 #0f0b1d, 0 0 14px rgba(255,51,85,.7); animation: sf-bob 1.4s ease-in-out infinite;">−2</span>
    </div>
  </div>

  <!-- ===== KEYPAD — lock released after the miss; the wrong key flashes red ===== -->
  <div dir="ltr" style="position: absolute; top: 666px; left: 16px; width: 358px; display: flex; gap: 4px;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
      <button type="button" aria-label="{{k.aria}}" style="flex: 1 1 0; min-width: 0; height: 62px; margin: 0; padding: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: {{k.bg}}; border: 2px solid {{k.bd}}; border-radius: 10px; box-shadow: {{k.sh}}; opacity: {{k.op}}; transform: {{k.tf}}; color: {{k.fg}}; cursor: pointer;">
        <span style="display: block; font-family: Teko, Rubik, sans-serif; font-weight: 600; font-size: 34px; line-height: .8; padding-top: 5px;">{{k.d}}</span>
        <span style="display: block; font: 600 9px/1 Rubik, sans-serif; color: {{k.sub}};">{{k.left}}</span>
      </button>
    </sc-for>
  </div>

  <button type="button" disabled style="position: absolute; top: 746px; left: 16px; width: 358px; height: 48px; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #251d45; border: 2px solid #4b3f80; border-radius: 10px; transform: skewX(-9deg); box-shadow: none; opacity: .4; color: #f1eeff;">
    <span style="display: flex; align-items: center; gap: 8px; transform: skewX(9deg); font: 600 17px/1 Rubik, sans-serif; white-space: nowrap;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 9l6 6M15 9l-6 6"></path></svg>
      ביטול בחירה
    </span>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  scenario() {
    // ranked2p, one move after Game-2P-Correct: I locked F8 and typed 4 (wrong — F8 is 1, and 4 is already in column 8).
    // 2nd mistake → −2 on the ladder (−1, −2, −4…), 55 → 53. The red 4 stays in F8 for both players; F8 is released.
    return {
      CURRENT: "864370209325009061970060043036002087198657402057083000680004105013508690542916370",
      OWNER: "00gg1.g.g11g..g.0g0g..g..gg.0g..g.gggg100gg.1.g1.gg...g0...1g.g.0gg.ggg.0gggg0g1.",
      WRONG: [{ i: 4, d: 5, seat: 1 }, { i: 44, d: 3, seat: 0 }, { i: 63, d: 4, seat: 1 }, { i: 52, d: 4, seat: 0 }],
      MINE: null,
      OPP: { i: 7, secs: 5, total: 12, seat: 1, av: "/_blob/ed8983d48ab35afdada5812fb8bc7a5a" },
      HIT: 52,
      FLASH: "4"
    };
  }
  board() {
    const S = this.scenario();
    const P = [
      { p: '#2ee6ff', deep: '#0098c2', tint: '#d3f8ff', solve: '#006b8a', clip: 'circle(50%)' },
      { p: '#ff8a1f', deep: '#c95600', tint: '#ffe6cf', solve: '#9a3f00', clip: 'polygon(50% 0, 100% 100%, 0 100%)' }
    ];
    const R = i => Math.floor(i / 9), C = i => i % 9;
    const opp = S.OPP;
    const boxes = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const v = S.CURRENT[i] === '0' ? '' : S.CURRENT[i];
        const o = S.OWNER[i];
        const shaded = bx % 2 === 1;
        const isOpp = !!opp && opp.i === i;
        let bg = shaded ? '#ece8fb' : '#fbfaff', fg = '#1a1433', ring = 'none', anim = 'none', glyph = '', clip = 'none';
        if (o === '0' || o === '1') { const pc = P[Number(o)]; bg = pc.tint; fg = pc.solve; glyph = pc.deep; clip = pc.clip; }
        if (isOpp) { bg = 'repeating-linear-gradient(135deg, #ffe6cf 0 4px, #fbfaff 4px 8px)'; ring = 'inset 0 0 0 3px #ff8a1f'; anim = 'sf-lock-opp 1.8s ease-in-out infinite'; }
        if (i === S.HIT) { bg = '#ffd3dc'; ring = 'inset 0 0 0 3px #ff3355, inset 0 0 14px rgba(255,51,85,.55)'; anim = 'sf-shake-loop 2.6s ease-in-out infinite'; }
        const w = S.WRONG.filter(x => x.i === i).map(x => String(x.d));
        const name = 'ABCDEFGHI'[R(i)] + String(C(i) + 1);
        cells.push({
          v: v, bg: bg, fg: fg, ring: ring, anim: anim, glyph: glyph, clip: clip,
          hasGlyph: !!glyph, hasWrong: w.length > 0, wrong: w.join(' '), wb: '2px',
          oppSel: isOpp, selColor: isOpp ? P[opp.seat].p : '', av: isOpp ? opp.av : '',
          secs: isOpp ? String(opp.secs) : '',
          aria: name + (v ? ' · ' + v : '') + (w.length ? ' · טעויות ' + w.join(' ') : '') + (isOpp ? ' · תפוסה' : '')
        });
      }
      boxes.push({ bx: bx, cells: cells });
    }
    return boxes;
  }
  rails() {
    const mine = this.scenario().MINE;
    const top = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => ({ t: String(g * 3 + k + 1), color: mine && mine.i % 9 === g * 3 + k ? '#2ee6ff' : '#a79fcb' })) }));
    const side = [0, 1, 2].map(g => ({ items: [0, 1, 2].map(k => ({ t: 'ABCDEFGHI'[g * 3 + k], color: mine && Math.floor(mine.i / 9) === g * 3 + k ? '#2ee6ff' : '#a79fcb' })) }));
    return { top: top, side: side };
  }
  keys() {
    const S = this.scenario();
    const out = [];
    for (let d = 1; d <= 9; d++) {
      const ch = String(d);
      let left = 9;
      for (let i = 0; i < 81; i++) { if (S.CURRENT[i] === ch) left--; }
      const key = {
        d: ch, left: String(left), aria: 'ספרה ' + d + ' · נותרו ' + left,
        op: left > 0 ? '.55' : '.3', bg: '#251d45', fg: '#f1eeff', sub: '#a79fcb',
        bd: '#4b3f80', sh: '0 4px 0 #07050f', tf: 'none'
      };
      if (ch === S.FLASH) {
        key.op = '1';
        key.bg = 'linear-gradient(180deg, #ff8a9d 0%, #ff3355 100%)';
        key.fg = '#ffffff';
        key.sub = '#ffe0e6';
        key.bd = '#ff3355';
        key.sh = '0 1px 0 #b8102f, 0 0 0 3px rgba(255,51,85,.3), 0 0 22px rgba(255,51,85,.6)';
        key.tf = 'translateY(3px)';
      }
      out.push(key);
    }
    return out;
  }
  renderVals() {
    const rails = this.rails();
    return { boxes: this.board(), railTop: rails.top, railSide: rails.side, keys: this.keys() };
  }
}
</script>
