<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Point hunter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Teko:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:#ffcf3f}a:hover{color:#ffe08a}
button{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;font-family:Rubik,'Segoe UI',system-ui,sans-serif;color:#eef1f6;background:#0f1218;">

  <!-- header -->
  <header style="position:absolute;top:48px;left:16px;right:16px;height:56px;display:flex;align-items:center;gap:12px;">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <h1 style="margin:0;font:700 22px/25px Rubik,sans-serif;color:#eef1f6;white-space:nowrap;">שלב 66</h1>
        <span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;box-sizing:border-box;border-radius:6px;border:1px solid #2a3140;background:#1f2430;font:500 12px/1 Rubik,sans-serif;color:#9aa3b5;white-space:nowrap;">פרק 7</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;color:#9aa3b5;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
        <span style="font:500 14px/18px Rubik,sans-serif;white-space:nowrap;">צייד הנקודות</span>
      </div>
    </div>
    <button type="button" aria-label="יציאה מהשלב" style="flex:none;width:44px;height:44px;margin:0;padding:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2a3140;border-radius:12px;color:#9aa3b5;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>

  <!-- goal -->
  <div style="position:absolute;top:116px;left:16px;right:16px;display:flex;flex-direction:column;gap:4px;">
    <p style="margin:0;font:500 15px/20px Rubik,sans-serif;color:#eef1f6;">אסוף <bdi dir="ltr">17.5</bdi> נקודות ב־3 מהלכים.</p>
    <p style="margin:0;font:400 13px/16px Rubik,sans-serif;color:#9aa3b5;">משבצת באזור ריק שווה יותר.</p>
  </div>

  <!-- HUD: points (start) · moves (centre) · time (end) -->
  <div style="position:absolute;top:166px;left:16px;right:16px;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;">
    <div role="img" aria-label="{{scoreAria}}" style="display:flex;align-items:baseline;gap:6px;min-width:0;">
      <span dir="ltr" style="font-family:Teko,Rubik,sans-serif;font-weight:600;font-size:44px;line-height:.8;padding-top:5px;font-variant-numeric:tabular-nums;color:#36c9f0;">{{scoreTxt}}</span>
      <span style="font:500 13px/1 Rubik,sans-serif;color:#9aa3b5;white-space:nowrap;">נקודות</span>
      <sc-if value="{{wrong}}" hint-placeholder-val="{{ false }}">
        <span dir="ltr" style="align-self:center;display:inline-flex;align-items:center;height:22px;padding:2px 6px 0;box-sizing:border-box;border-radius:6px;background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.55);font-family:Teko,Rubik,sans-serif;font-weight:500;font-size:20px;line-height:.8;color:#ff4d5e;">−6</span>
      </sc-if>
    </div>
    <div role="img" aria-label="{{movesAria}}" style="display:flex;flex-direction:column;align-items:center;gap:7px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <sc-for list="{{moves}}" as="m" hint-placeholder-count="3">
          <span style="width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:{{m.bg}};border:{{m.bd}};display:flex;align-items:center;justify-content:center;">
            <sc-if value="{{m.burnt}}" hint-placeholder-val="{{ false }}">
              <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#ff4d5e" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </sc-if>
          </span>
        </sc-for>
      </div>
      <span style="font:400 13px/16px Rubik,sans-serif;color:{{movesColor}};white-space:nowrap;">{{movesTxt}}</span>
    </div>
    <div role="img" aria-label="נותרו 14 שניות מתוך 30" style="justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
      <span dir="ltr" style="font-family:Teko,Rubik,sans-serif;font-weight:600;font-size:28px;line-height:.8;padding-top:4px;font-variant-numeric:tabular-nums;color:#eef1f6;">0:14</span>
      <span style="font:400 13px/16px Rubik,sans-serif;color:#9aa3b5;white-space:nowrap;">נותרו · מתוך <bdi dir="ltr">0:30</bdi></span>
    </div>
  </div>

  <!-- star meter: points on 0–18 (the best this board allows); marks at 70 / 85 / 95 % -->
  <div dir="ltr" role="progressbar" aria-label="{{meterAria}}" aria-valuemin="0" aria-valuemax="18" aria-valuenow="{{scoreTxt}}" style="position:absolute;top:234px;left:16px;width:358px;height:46px;">
    <span dir="rtl" style="position:absolute;top:0;left:0;font:400 13px/12px Rubik,sans-serif;color:#9aa3b5;white-space:nowrap;">המקסימום בלוח: <bdi dir="ltr">18</bdi></span>
    <sc-for list="{{marks}}" as="mk" hint-placeholder-count="3">
      <span style="position:absolute;top:0;left:{{mk.x}};transform:{{mk.tx}};display:flex;align-items:center;gap:2px;height:12px;">
        <sc-for list="{{mk.stars}}" as="s" hint-placeholder-count="3">
          <svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="2" stroke-linejoin="round"></path></svg>
        </sc-for>
      </span>
    </sc-for>
    <div style="position:absolute;top:18px;left:0;width:358px;height:6px;border-radius:3px;background:#1f2430;overflow:hidden;">
      <span style="position:absolute;top:0;bottom:0;left:0;width:{{fillW}};border-radius:3px;background:#36c9f0;"></span>
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="3">
        <span style="position:absolute;top:0;bottom:0;left:{{t.x}};width:2px;margin-left:-1px;background:#0f1218;"></span>
      </sc-for>
    </div>
    <sc-for list="{{axis}}" as="a" hint-placeholder-count="4">
      <span style="position:absolute;top:32px;left:{{a.x}};transform:{{a.tx}};font-family:Teko,Rubik,sans-serif;font-weight:600;font-size:15px;line-height:.8;padding-top:2px;font-variant-numeric:tabular-nums;color:#9aa3b5;">{{a.t}}</span>
    </sc-for>
  </div>

  <!-- board (LTR) -->
  <div dir="ltr" role="group" aria-label="לוח המשחק · המשבצת שלך F4" style="position:absolute;top:290px;left:16px;width:358px;height:358px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3px;background:#0f1218;border-radius:12px;overflow:hidden;">
    <sc-for list="{{boxes}}" as="box" hint-placeholder-count="9">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:1px;background:#c8cdd6;">
        <sc-for list="{{box.cells}}" as="cell" hint-placeholder-count="9">
          <button type="button" aria-label="{{cell.aria}}" style="position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;margin:0;padding:0;border:0;border-radius:0;background:{{cell.bg}};box-shadow:{{cell.ring}};color:{{cell.fg}};font-family:Rubik,sans-serif;font-weight:{{cell.fw}};font-size:22px;line-height:1;">
            <sc-if value="{{cell.plain}}" hint-placeholder-val="{{ true }}">{{cell.v}}</sc-if>
            <sc-if value="{{cell.scored}}" hint-placeholder-val="{{ false }}">
              <span style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px;">
                <span style="font:500 18px/1 Rubik,sans-serif;color:#0b6a85;">{{cell.v}}</span>
                <span style="display:block;height:14px;padding:1px 3px 0;box-sizing:border-box;border-radius:4px;background:#0f1218;font-family:Teko,Rubik,sans-serif;font-weight:600;font-size:15px;line-height:14px;color:#36c9f0;">{{cell.pts}}</span>
              </span>
              <svg aria-hidden="true" width="6" height="6" viewBox="0 0 24 24" style="position:absolute;top:3px;left:3px;"><path d="M12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16z" fill="#0b6a85"></path></svg>
            </sc-if>
            <sc-if value="{{cell.hasWrong}}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;right:3px;bottom:2px;font:700 11px/1 Rubik,sans-serif;color:#b8102f;">{{cell.wrongMark}}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- "worth 6" over the chosen cell (only in the first two levels of this type) -->
  <sc-if value="{{showWorth}}" hint-placeholder-val="{{ true }}">
    <div dir="ltr" aria-hidden="true" style="position:absolute;top:290px;left:16px;width:358px;height:358px;pointer-events:none;">
      <div style="position:absolute;left:139.6px;top:169px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;">
        <span dir="rtl" style="display:flex;align-items:center;height:24px;padding:0 8px;box-sizing:border-box;border-radius:6px;background:#0f1218;border:1px solid #36c9f0;font:500 13px/1 Rubik,sans-serif;color:#eef1f6;white-space:nowrap;">שווה 6</span>
        <span style="display:block;width:8px;height:8px;margin-top:-5px;box-sizing:border-box;background:#0f1218;border-right:1px solid #36c9f0;border-bottom:1px solid #36c9f0;transform:rotate(45deg);"></span>
      </div>
    </div>
  </sc-if>

  <!-- keypad (LTR) -->
  <div dir="ltr" style="position:absolute;top:664px;left:16px;width:358px;height:60px;display:flex;gap:4px;opacity:{{padOp}};">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
      <button type="button" aria-label="{{k.aria}}" style="flex:1 1 0;min-width:0;height:60px;margin:0;padding:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#1f2430;border:1px solid {{k.bd}};border-radius:10px;opacity:{{k.op}};">
        <span style="font-family:Teko,Rubik,sans-serif;font-weight:600;font-size:32px;line-height:.8;padding-top:4px;color:#eef1f6;">{{k.d}}</span>
        <span style="font:500 12px/1 Rubik,sans-serif;color:#9aa3b5;">{{k.left}}</span>
      </button>
    </sc-for>
  </div>
  <div style="position:absolute;top:738px;left:16px;right:16px;height:44px;display:flex;justify-content:center;">
    <button type="button" style="height:44px;margin:0;padding:0 16px;box-sizing:border-box;display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:12px;font:500 15px/1 Rubik,sans-serif;color:#9aa3b5;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 9l6 6M15 9l-6 6"></path></svg>
      <span style="white-space:nowrap;">ביטול בחירה</span>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"wrongDigit":false}'>
class Component extends DCLogic {
  // Level 66 (chapter 7): a "fast" board with 47 givens, 3 moves in 30 s at most (14 s left now).
  // Checked with the engine (moveScore, LogicBoard):
  // move 1: 4 in C2 = +6.5 (X 5, Y 4) · move 2: 2 in H8 = +5.5 (X 6, Y 4) · now F4 (right digit 5) is worth 6 (X 5, Y 5).
  // The best 3 moves on this board (cells a single decides at each step) total 18, so the marks are 13 / 15.5 / 17.5.
  // F4 can hold 5 or 6; the variant types 6: the game's penalty is what 5 would have scored there, 6.
  fixture() {
    return {
      PUZ: '900402678037056002006987010300700254702310809094028030503091006060805003428070501',
      SOL: '915432678837156942246987315381769254752314869694528137573291486169845723428673591',
      MOVES: { 19: '+6.5', 70: '+5.5' },
      SEL: 48,
      TYPED: '6'
    };
  }

  boxes(wrong) {
    const F = this.fixture();
    const out = [];
    for (let bx = 0; bx < 9; bx++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(bx / 3) * 3 + Math.floor(k / 3)) * 9 + (bx % 3) * 3 + (k % 3);
        const name = 'ABCDEFGHI'[Math.floor(i / 9)] + String(i % 9 + 1);
        const pts = F.MOVES[i];
        const scored = !!pts;
        const sel = i === F.SEL;
        let v = F.PUZ[i] === '0' ? '' : F.PUZ[i];
        if (scored) v = F.SOL[i];
        let bg = bx % 2 ? '#eceff4' : '#f7f8fa';
        let fg = '#0f1218', fw = '600', ring = 'none';
        if (scored) { bg = '#d6f4fc'; fg = '#0b6a85'; fw = '500'; }
        let aria = name + ' · ' + (v ? v : 'ריקה');
        if (scored) aria = name + ' · ' + v + ' · שלך · ' + pts + ' נקודות';
        if (sel && !wrong) { bg = '#d6f4fc'; ring = 'inset 0 0 0 3px #36c9f0'; aria = name + ' · נבחרה · שווה 6 נקודות'; }
        if (sel && wrong) { bg = '#fb9aa4'; fg = '#b8102f'; fw = '700'; v = F.TYPED; aria = name + ' · 6 שגוי · ‎−6 נקודות'; }
        cells.push({
          v: v, bg: bg, fg: fg, fw: fw, ring: ring, aria: aria,
          plain: !scored, scored: scored, pts: pts || '',
          hasWrong: false, wrongMark: ''
        });
      }
      out.push({ cells: cells });
    }
    return out;
  }

  keys(wrong) {
    // left = 9 − the digit's count on the board now (47 givens + my 4 in C2 + my 2 in H8)
    const LEFT = [5, 2, 3, 4, 4, 4, 3, 3, 4];
    const out = [];
    for (let d = 1; d <= 9; d++) {
      const left = LEFT[d - 1];
      out.push({ d: String(d), left: String(left), op: left > 0 ? '1' : '.3',
        bd: wrong ? '#2a3140' : 'rgba(54,201,240,.5)', aria: 'ספרה ' + d + ' · נותרו ' + left });
    }
    return out;
  }

  renderVals() {
    const p = this.props || {};
    const wrong = !!p.wrongDigit;
    const W = 358, MAX = 18;
    const score = wrong ? 6 : 12;
    const x = (s) => (s / MAX * W).toFixed(1) + 'px';
    const st = wrong ? { fill: 'none', stroke: '#677086' } : { fill: '#ffcf3f', stroke: '#ffcf3f' };
    const stars = (n) => { const a = []; for (let k = 0; k < n; k++) a.push(st); return a; };
    const USED = { bg: '#36c9f0', bd: '0', burnt: false };
    const NOW = { bg: 'transparent', bd: '2px solid #36c9f0', burnt: false };
    const BURNT = { bg: 'rgba(255,77,94,.16)', bd: '1px solid #ff4d5e', burnt: true };
    return {
      wrong: wrong,
      showWorth: !wrong,
      scoreTxt: String(score),
      scoreAria: wrong ? '6 נקודות · ירדו 6 על ספרה שגויה' : '12 נקודות',
      moves: [USED, USED, wrong ? BURNT : NOW],
      movesTxt: wrong ? 'מהלך 3 נשרף' : 'מהלך 3 מתוך 3',
      movesColor: wrong ? '#ff4d5e' : '#9aa3b5',
      movesAria: wrong ? 'המהלך השלישי נשרף' : 'מהלך 3 מתוך 3 · שניים כבר שוחקו',
      meterAria: wrong ? 'נקודות: 6 מתוך 18 · אין כוכבים' : 'נקודות: 12 מתוך 18 · כוכב אחד ב־13, שניים ב־15.5, שלושה ב־17.5',
      fillW: (score / MAX * 100).toFixed(2) + '%',
      marks: [
        { x: x(13), tx: 'translateX(-50%)', stars: stars(1) },
        { x: x(15.5), tx: 'translateX(-50%)', stars: stars(2) },
        { x: W + 'px', tx: 'translateX(-100%)', stars: stars(3) }
      ],
      ticks: [{ x: x(13) }, { x: x(15.5) }, { x: x(17.5) }],
      axis: [
        { t: '0', x: '0px', tx: 'none' },
        { t: '13', x: x(13), tx: 'translateX(-50%)' },
        { t: '15.5', x: x(15.5), tx: 'translateX(-50%)' },
        { t: '17.5', x: W + 'px', tx: 'translateX(-100%)' }
      ],
      padOp: wrong ? '.55' : '1',
      keys: this.keys(wrong),
      boxes: this.boxes(wrong)
    };
  }
}
</script>
</body>
</html>
