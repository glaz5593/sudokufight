// The app's own Expo module (localization plan, native settings; D103): Android's per-app language ("App
// languages", LocaleManager, Android 13+). Autolinked from apps/mobile/modules/ (Expo's default
// nativeModulesDir); the JS side is apps/mobile/src/services/appLocale.ts.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mosheg.sudokufight'
version = '1.0.0'

android {
  namespace "com.mosheg.sudokufight.applocale"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
