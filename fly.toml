# Fly.io: the game server's STAGING app. Commands: README, "פריסה ל־Fly.io (Staging)".
#
# One machine in one region (work plan, stage 7; spec §17.1). Colyseus keeps rooms and matchmaking in the
# memory of its one process, so this app runs exactly one machine: deploy with `fly deploy --ha=false`, and
# never scale it out.
#
# Secrets (fly secrets set): DATABASE_URL, FIREBASE_PROJECT_ID, the admin site's Google sign-in (ADMIN_EMAILS,
# FIREBASE_WEB_API_KEY, FIREBASE_WEB_APP_ID), and optionally SENTRY_DSN for error reports, LEGAL_*,
# ADMIN_PASSWORD, ADMIN_SESSION_SECRET. Nothing secret goes in here. Production is a separate app:
# fly.production.toml.

app = "sudoku-fight-staging"
primary_region = "fra"
# Colyseus shuts down cleanly on SIGTERM: it stops matchmaking, disconnects the rooms, closes the database.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"
  # Fly's proxy is the one hop in front of the server, so req.ip is the client's address (rate limits per IP).
  # A hop count, not `true`.
  TRUST_PROXY = "1"
  ADMIN_TZ = "Asia/Jerusalem"
  # Sentry tells staging from production by this (both run NODE_ENV=production).
  SENTRY_ENVIRONMENT = "staging"

[http_service]
  internal_port = 2567
  force_https = true
  # A stopped machine drops every game in progress, and there is only one: it stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Each WebSocket is one connection for as long as its game lasts (Fly's default hard limit is 25).
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  # The server answers only once the database is open and migrated.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
